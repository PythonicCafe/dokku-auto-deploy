[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dokku-auto-deploy"
dynamic = ["version"]
description = "Deploy Dokku apps from GitHub branches once their CI passes, without giving GitHub access to the server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Álvaro Justen", email = "alvarojusten@gmail.com" },
]
keywords = ["dokku", "deploy", "github", "ci", "cd", "gitflow", "telegram"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Software Distribution",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/PythonicCafe/dokku-auto-deploy"
Repository = "https://github.com/PythonicCafe/dokku-auto-deploy"
Issues = "https://github.com/PythonicCafe/dokku-auto-deploy/issues"

[project.scripts]
dokku-auto-deploy = "dokku_auto_deploy.cli:main"

[tool.setuptools]
packages = ["dokku_auto_deploy"]

[tool.setuptools.dynamic]
version = { attr = "dokku_auto_deploy.__version__" }

[dependency-groups]
dev = [
    "build>=1",
    "coverage>=7",
    "mypy>=1.15",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.11",
    "twine>=6",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "SIM", "C4", "A", "UP", "B"]
ignore = ["E203", "E231", "E501", "E701"]

[tool.ruff.lint.isort]
split-on-trailing-comma = true

[tool.mypy]
python_version = "3.11"
strict = true
enable_error_code = ["possibly-undefined"]
files = ["dokku_auto_deploy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["dokku_auto_deploy"]

[tool.coverage.report]
show_missing = true
